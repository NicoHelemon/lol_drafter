name: Refresh statistics
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish production data (main only, requires explicit operator approval)'
        type: boolean
        default: false
  schedule:
    # Avoid top-of-hour load. Later checks catch dropped/failed runs and only
    # collect if the published snapshot still predates today's daily target.
    - cron: '7 6 * * *'
      timezone: Europe/Zurich
    - cron: '17 9,15 * * *'
      timezone: Europe/Zurich
permissions:
  contents: read
concurrency:
  group: statistics-refresh
  cancel-in-progress: false
jobs:
  schedule:
    if: github.event_name == 'workflow_dispatch' || vars.STATISTICS_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.freshness.outputs.allowed }}
      cache_date: ${{ steps.freshness.outputs.cache_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: freshness
        name: Check published freshness before starting backend work
        run: python3 scripts/statistics/schedule.py
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  validate:
    needs: schedule
    if: needs.schedule.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/statistics -v
      - name: Verify configured source and backend access without changing data
        run: |
          python3 - <<'PY'
          import os
          if os.environ['STATISTICS_SOURCE'] not in ('export', 'lolalytics'):
              raise SystemExit('Invalid STATISTICS_SOURCE')
          if not os.environ.get('SUPABASE_ACCESS_TOKEN') or not os.environ.get('SUPABASE_PROJECT_REF', '').isalnum():
              raise SystemExit('Missing backend configuration')
          if os.environ['STATISTICS_SOURCE'] == 'export' and not os.environ.get('STATISTICS_IMPORT_URL'):
              raise SystemExit('Missing authorized export URL')
          print('Scheduled refresh enabled:', os.environ.get('STATISTICS_REFRESH_ENABLED') == 'true')
          print('Backend configuration present; checking read access')
          PY
          python3 scripts/statistics/maintenance.py --audit > statistics-audit.json
          cat statistics-audit.json
        env:
          STATISTICS_REFRESH_ENABLED: ${{ vars.STATISTICS_REFRESH_ENABLED }}
          STATISTICS_SOURCE: ${{ vars.STATISTICS_SOURCE || 'lolalytics' }}
          STATISTICS_IMPORT_URL: ${{ secrets.STATISTICS_IMPORT_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - uses: actions/upload-artifact@v4
        with:
          name: statistics-read-only-audit
          path: statistics-audit.json
          retention-days: 7
  refresh:
    needs: [schedule, validate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: cache_restore
        name: Restore this daily collection's verified response cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: statistics-cache/daily/responses
          key: statistics-v2-${{ runner.os }}-${{ needs.schedule.outputs.cache_date }}-${{ hashFiles('src/data/champions.json', 'scripts/statistics/collect_lolalytics.py', 'scripts/statistics/inspect_lolalytics.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            statistics-v2-${{ runner.os }}-${{ needs.schedule.outputs.cache_date }}-${{ hashFiles('src/data/champions.json', 'scripts/statistics/collect_lolalytics.py', 'scripts/statistics/inspect_lolalytics.py') }}-
      - run: python3 scripts/statistics/refresh.py
        timeout-minutes: 50
        env:
          STATISTICS_WORK_DIR: statistics-cache/daily
          STATISTICS_SOURCE: ${{ vars.STATISTICS_SOURCE || 'lolalytics' }}
          STATISTICS_IMPORT_URL: ${{ secrets.STATISTICS_IMPORT_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Verify the new daily publication
        run: python3 scripts/statistics/schedule.py --verify
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Report failed refresh
        if: failure()
        run: |
          echo '::error::Daily statistics refresh failed. A successful collection/publication has not been confirmed; inspect this run.'
          echo 'Daily refresh failed. The last complete published snapshot remains available unless publication completed before the error. Check the publication logs.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve verified responses even after an interrupted collection
        if: always() && steps.cache_restore.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: statistics-cache/daily/responses
          key: ${{ steps.cache_restore.outputs.cache-primary-key }}
