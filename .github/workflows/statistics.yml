name: Refresh statistics
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish production data (main only, requires explicit operator approval)'
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Zurich
permissions:
  contents: read
concurrency:
  group: statistics-refresh
  cancel-in-progress: false
jobs:
  schedule:
    if: github.event_name == 'workflow_dispatch' || vars.STATISTICS_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      allowed: ${{ steps.window.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
      - id: window
        name: Check Swiss morning window before starting backend work
        run: python3 scripts/statistics/schedule.py
  validate:
    needs: schedule
    if: needs.schedule.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/statistics -v
      - name: Verify configured source and backend access without changing data
        run: |
          python3 - <<'PY'
          import os
          if os.environ['STATISTICS_SOURCE'] not in ('export', 'lolalytics'):
              raise SystemExit('Invalid STATISTICS_SOURCE')
          if not os.environ.get('SUPABASE_ACCESS_TOKEN') or not os.environ.get('SUPABASE_PROJECT_REF', '').isalnum():
              raise SystemExit('Missing backend configuration')
          if os.environ['STATISTICS_SOURCE'] == 'export' and not os.environ.get('STATISTICS_IMPORT_URL'):
              raise SystemExit('Missing authorized export URL')
          print('Scheduled refresh enabled:', os.environ.get('STATISTICS_REFRESH_ENABLED') == 'true')
          print('Backend configuration present; checking read access')
          PY
          python3 scripts/statistics/maintenance.py --audit > statistics-audit.json
          cat statistics-audit.json
        env:
          STATISTICS_REFRESH_ENABLED: ${{ vars.STATISTICS_REFRESH_ENABLED }}
          STATISTICS_SOURCE: ${{ vars.STATISTICS_SOURCE || 'lolalytics' }}
          STATISTICS_IMPORT_URL: ${{ secrets.STATISTICS_IMPORT_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - uses: actions/upload-artifact@v4
        with:
          name: statistics-read-only-audit
          path: statistics-audit.json
          retention-days: 7
  refresh:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/statistics/refresh.py
        env:
          STATISTICS_SOURCE: ${{ vars.STATISTICS_SOURCE || 'lolalytics' }}
          STATISTICS_IMPORT_URL: ${{ secrets.STATISTICS_IMPORT_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
